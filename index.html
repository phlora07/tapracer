<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#151719"><title>TapRacer — Уличный тюнинг</title><script src="https://telegram.org/js/telegram-web-app.js"></script><style>
:root{--bg:#111315;--panel:#202326;--line:#3b3f42;--gold:#ffd12c;--muted:#aeb1b5;--red:#f05a4d;--green:#66c77a}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#f4f4f4;font:15px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}button,input,select{font:inherit}button{cursor:pointer}#app{max-width:680px;margin:auto;padding:14px 14px 92px}.top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:14px}.brand{font-weight:950;font-size:24px;font-style:italic;letter-spacing:-1px}.brand small{display:block;font-size:10px;color:var(--gold);letter-spacing:2px;font-style:normal}.wallet{background:#292b2d;border:1px solid #484848;padding:10px 12px;border-radius:12px;font-weight:800;color:var(--gold)}.panel{background:linear-gradient(145deg,#272a2d,#1b1e20);border:1px solid #383d40;border-radius:16px;padding:15px;margin:12px 0;box-shadow:0 8px 20px #0003}.title{font-size:21px;font-weight:850;margin:0 0 12px}.sub{color:var(--muted);font-size:12px}.gold{color:var(--gold)}.btn{background:var(--gold);border:0;color:#111;border-radius:10px;padding:13px 14px;font-weight:850;min-height:45px}.btn:disabled{opacity:.4}.btn.alt{background:#393d40;color:#fff;border:1px solid #56595c}.btn.red{background:#85302e;color:white}.btn.green{background:#27683b;color:white}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:9px}.stack{display:grid;gap:9px}.row{display:flex;justify-content:space-between;align-items:center;gap:10px}.row.wrap{flex-wrap:wrap}.pill{display:inline-block;padding:5px 9px;border-radius:7px;background:#383c3f;color:#ddd;font-size:12px}.hero{height:205px;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;background:linear-gradient(#313539 0 56%,#292b2d 56%);border-radius:12px;margin:12px 0}.hero:before{content:'';position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 70px,#ffffff0a 71px 73px);opacity:.5}.car-art{position:relative;z-index:1;font-size:105px;filter:drop-shadow(0 12px 4px #0008);line-height:1}.plate{display:inline-flex;align-items:center;background:#f8f8f8;border:2px solid #111;color:#111;border-radius:4px;font:bold 18px monospace;padding:3px 6px;letter-spacing:1px}.plate .region{border-left:2px solid #111;padding-left:5px;margin-left:7px;font-size:12px;text-align:center;letter-spacing:0}.plate .region small{display:block;font-size:8px}.statgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.stat{background:#151719;border:1px solid #34383b;border-radius:10px;padding:11px}.stat b{display:block;font-size:18px;margin-top:4px}.list{display:grid;gap:9px}.item{border:1px solid #414549;border-radius:12px;background:#292c2f;padding:12px}.item .name{font-weight:800}.item .sub{margin:5px 0}.item .row{margin-top:8px}.tabs{display:flex;gap:7px;overflow:auto;padding:4px 0 10px}.tabs button{flex-shrink:0;border:1px solid #505457;background:#292c2e;color:white;padding:8px 10px;border-radius:9px}.tabs button.on{background:var(--gold);color:#111;border-color:var(--gold)}.nav{position:fixed;z-index:10;bottom:0;left:0;right:0;background:#1c1e20;border-top:1px solid #43474b;display:flex;justify-content:space-around;padding:8px 4px max(9px,env(safe-area-inset-bottom))}.nav button{background:none;border:0;color:#bbb;font-size:11px;display:grid;gap:4px;justify-items:center}.nav button span{font-size:22px}.nav button.on{color:var(--gold)}input,select{width:100%;background:#141719;border:1px solid #565b5f;color:white;border-radius:9px;padding:12px;margin:5px 0}.bar{height:15px;background:#414447;border-radius:12px;overflow:hidden}.bar>div{height:100%;background:var(--gold);transition:width .08s linear}.meter{height:35px;background:#333;border-radius:9px;position:relative;overflow:hidden;margin:15px 0}.zone{position:absolute;left:60%;width:25%;height:100%;background:#388b43}.needle{position:absolute;top:0;height:100%;width:5px;background:white;box-shadow:0 0 8px white}.racer{display:flex;justify-content:space-between;gap:10px}.racer>div{flex:1;text-align:center;padding:12px 4px;background:#151719;border-radius:12px}.bigTap{height:100px;width:100%;font-size:28px;touch-action:manipulation}.overlay{position:fixed;z-index:20;inset:0;background:#000d;display:flex;align-items:center;justify-content:center;padding:18px}.dialog{background:#25282b;border:1px solid #6b6d6f;border-radius:16px;padding:20px;width:min(100%,440px);max-height:90vh;overflow:auto}.hide{display:none!important}.notice{font-size:13px;line-height:1.5;color:#c2c4c6}.smallbtn{padding:8px 10px;font-size:12px;min-height:35px}.divider{height:1px;background:#404448;margin:12px 0}</style></head><body><div id="app"></div><div id="modal" class="overlay hide"><div class="dialog" id="dialog"></div></div><script>
'use strict';
const tg=window.Telegram?.WebApp;try{tg?.ready();tg?.expand()}catch(e){}
const C=[
['ВАЗ-2101','Копейка',100,64,140,'Стартовый'],['ВАЗ-2107','Семёрка',150,72,150,'Стартовый'],['ВАЗ-2109','Девятка',200,78,155,'Стартовый'],['ВАЗ-21099','Девяносто девятая',250,80,160,'Стартовый'],['Toyota Corolla','Королла',300,110,180,'Стартовый'],
['Toyota Mark II','Марк II',400,200,230,'Средний'],['BMW 5 Series E34','Бумер',450,192,225,'Средний'],['Nissan Skyline GT-R R32','Скайлайн',600,280,250,'Средний'],['Li Auto L7','Лисян',700,330,240,'Средний'],['Volkswagen Passat B5','Пассат',500,150,210,'Средний'],['Kia K5','Кей-Фаив',650,194,220,'Средний'],
['Mercedes-Benz S-Class W140','Мерседес',900,320,250,'Премиум'],['Toyota Supra','Супра',1100,330,260,'Премиум'],['Zeekr 001','Зикр',1300,544,260,'Премиум'],['Audi RS6','Ауди',1500,600,305,'Премиум'],['Range Rover','Рендж',1400,400,250,'Премиум'],['BMW M5 E60','М5 Е60',1600,507,305,'Премиум'],['BMW M5 F90','М5 Ф90',1800,625,305,'Премиум'],
['Ferrari F40','Феррари',2000,478,324,'Легендарный'],['Lamborghini Diablo','Ламбо',2500,492,325,'Легендарный'],['McLaren P1','Макларен',3500,916,350,'Легендарный'],['Bugatti Veyron','Бугатти',4000,1001,407,'Легендарный'],['ГАЗ-31105 Волга','Волга',5000,9999,420,'Легендарный'],
['ЗиЛ Чёрный Бумер','Чёрный Бумер',0,500,250,'Stars'],['ГАЗ-13 Чайка','Чайка Босса',0,450,230,'Stars'],['Aurus Senat','Кортеж',0,600,250,'Stars']].map((x,i)=>({id:i,name:x[0],nick:x[1],price:x[2],hp:x[3],speed:x[4],cls:x[5]}));
const SLOTS=[{name:'Двигатель',opts:[['Сток',0,0,0,0],['Турбо',120,.3,10,0],['Свап от иномарки',350,.6,20,0]]},{name:'Обвес',opts:[['Сток',0,0,0,0],['Спойлер-тапок',50,0,5,5],['Кенгурятник',70,0,3,3],['Полный обвес',200,0,8,0],['Экспедиционник',150,0,5,0]]},{name:'Выхлоп и колёса',opts:[['Сток',0,0,0,0],['Прямоток + R17',100,0,7,10],['Спортвыхлоп + R18',300,0,12,0]]},{name:'Понты',opts:[['Сток',0,0,0,0],['Тонировка в круг',70,0,0,15],['Ксенон в туманки',80,0,0,10],['Мигалки',500,0,30,25]]}];
const REGIONS=['77','99','97','177','199','777','799','50','90','150','750','78','98','178','198','47','147','747','16','116','716','23','93','123','66','96','196','61','161','63','163','54','154','74','174','52','152','02','102','24','124','26','126','36','136','34','134','42','142','55','125','25','38','138','59','159','72','86','186','89','29','35','39','40','46','48','56','58','64','69','71','73','76','82','92','95'];
const LETTERS='АВЕКМНОРСТУХ';const KEY='tapracer-v1';const fresh=()=>({coins:300,owned:[0],active:0,tune:{'0':[0,0,0,0]},plates:{'0':'А777АА77'},homeRegion:'77',wins:0,losses:0,races:0,clean:0,escapes:0,bribes:0,impounds:0,streak:0,lastBonus:'',history:[],achievements:[],impoundUntil:0,level:1});
let p;try{p={...fresh(),...JSON.parse(localStorage.getItem(KEY)||'{}')}}catch(e){p=fresh()}if(!Array.isArray(p.owned)||!p.owned.length)p=fresh();let screen='garage',filter='Все',race=null,raceTimer=null,modalState=null;const $=id=>document.getElementById(id);const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(p))}catch(e){}};const fmt=n=>Math.round(n).toLocaleString('ru-RU');const date=()=>new Date().toLocaleDateString('en-CA');const car=()=>C[p.active];const tun=()=>p.tune[p.active]||[0,0,0,0];const priceTune=id=>(p.tune[id]||[0,0,0,0]).reduce((s,v,i)=>s+SLOTS[i].opts[v][1],0);const stats=()=>{let t=tun(),c=car();return {hp:Math.round(c.hp*(1+SLOTS[0].opts[t[0]][2])),speed:c.speed+t.reduce((s,v,i)=>s+SLOTS[i].opts[v][3],0),risk:Math.max(0,Math.min(100,15+t.reduce((s,v,i)=>s+SLOTS[i].opts[v][4],0)-(p.active===22?20:0)-(p.active===25?100:0)-(specialPlate()?30:0))),value:c.price+priceTune(p.active)}};const specialPlate=()=>/^(МЕНТ|ДПС|ФСБ)/.test(p.plates[p.active]||'');const plate=()=>{let s=p.plates[p.active]||'А777АА77',m=s.match(/^([АВЕКМНОРСТУХ]\d{3}[АВЕКМНОРСТУХ]{2})(\d{2,3})$/);return `<div class="plate">${m?m[1]:escapeHtml(s)}<span class="region">${m?m[2]:'★'}<small>🇷🇺 RUS</small></span></div>`};const escapeHtml=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const btn=(label,fn,cls='')=>`<button class="btn ${cls}" onclick="${fn}">${label}</button>`;const notify=(title,msg)=>showModal(`<h2>${title}</h2><p>${msg}</p>${btn('Понятно','closeModal()')}`);const showModal=html=>{$('dialog').innerHTML=html;$('modal').classList.remove('hide')};function closeModal(){$('modal').classList.add('hide');modalState=null}function vibrate(type='light'){try{tg?.HapticFeedback?.impactOccurred(type)}catch(e){}}function log(s){p.history.unshift({date:new Date().toLocaleString('ru-RU'),text:s});p.history=p.history.slice(0,70);save()};
function daily(){let today=date();if(p.lastBonus===today)return;let yesterday=new Date();yesterday.setDate(yesterday.getDate()-1);p.streak=p.lastBonus===yesterday.toLocaleDateString('en-CA')?p.streak+1:1;p.lastBonus=today;p.coins+=20;log('Ежедневный бонус +20');setTimeout(()=>notify('Ежедневный бонус','За вход начислено <b class="gold">20 монет</b>. Серия: '+p.streak+' дн.'),300)}
function render(){let s=stats();$('app').innerHTML=`<div class="top"><div class="brand">TapRacer<small>УЛИЧНЫЙ ТЮНИНГ</small></div><div class="wallet">🪙 ${fmt(p.coins)}</div></div><main id="content">${({garage:garageView,shop:shopView,tuning:tuningView,race:raceView,profile:profileView,plates:platesView,dps:dpsView,achievements:achView,admin:adminView,history:historyView})[screen]()}</main><nav class="nav">${[['garage','🏠','Гараж'],['shop','🚘','Автосалон'],['race','🏁','Гонки'],['tuning','🔧','Тюнинг'],['profile','👤','Профиль']].map(x=>`<button class="${screen===x[0]?'on':''}" onclick="go('${x[0]}')"><span>${x[1]}</span>${x[2]}</button>`).join('')}</nav>`;if(screen==='race'&&race)drawRace()}
function go(x){if(race&&screen==='race'&&x!=='race'){stopRace()}screen=x;render();scrollTo(0,0)}
function garageView(){let c=car(),s=stats();return `<section class="panel"><div class="row"><div><div class="sub">ТВОЙ ГАРАЖ • ${c.cls}</div><h2 class="title">${escapeHtml(c.name)} «${escapeHtml(c.nick)}»</h2></div><span class="pill">Ур. ${p.level}</span></div><div class="hero"><div class="car-art">${p.active===22?'🚙':p.active>=23?'🚘':'🚗'}</div></div><div style="text-align:center">${plate()}</div><div class="statgrid" style="margin-top:14px"><div class="stat">Мощность<b>${fmt(s.hp)} л.с.</b></div><div class="stat">Макс. скорость<b>${s.speed} км/ч</b></div><div class="stat">0–100 км/ч<b>${Math.max(1.9,+(13.5*110/(s.hp+46)).toFixed(1))} с</b></div><div class="stat">Риск ДПС<b style="color:${s.risk>35?'var(--red)':'var(--gold)'}">${s.risk}%</b></div></div></section><div class="stack">${btn('🏁 На гонку с ботом','go(\'race\')') }<div class="grid2">${btn('🔧 Тюнинг','go(\'tuning\')','alt')}${btn('🚘 Мои машины','go(\'shop\')','alt')}${btn('🔢 Сменить номер','go(\'plates\')','alt')}${btn('🚔 ДПС и штрафстоянка','go(\'dps\')','alt')}</div></div><div class="panel"><div class="title">Гаражные новости</div><p class="notice">Гонки с ИИ, тюнинг и прогресс работают без онлайна. Дуэли, сходка и Stars появятся в следующих обновлениях.</p></div>`}
function shopView(){return `<h2 class="title">Автосалон</h2><div class="tabs">${['Все','Стартовый','Средний','Премиум','Легендарный','Stars','Мои'].map(x=>`<button class="${filter===x?'on':''}" onclick="setFilter('${x}')">${x}</button>`).join('')}</div><div class="list">${C.filter(c=>filter==='Все'||filter===c.cls||(filter==='Мои'&&p.owned.includes(c.id))).map(c=>`<div class="item"><div class="row"><div><div class="name">🚗 ${escapeHtml(c.name)}</div><div class="sub">${c.cls} · ${fmt(c.hp)} л.с. · ${c.speed} км/ч</div></div><span class="pill">${c.cls==='Stars'?'⭐ Stars':fmt(c.price)+' 🪙'}</span></div><div class="row">${p.owned.includes(c.id)?`${btn(c.id===p.active?'Выбрана':'Выбрать',`selectCar(${c.id})`,'alt smallbtn')}${c.id===p.active?'':btn('Продать',`sellCar(${c.id})`,'red smallbtn')}`:btn(c.cls==='Stars'?'Скоро':'Купить',`buyCar(${c.id})`,'smallbtn'+(c.cls==='Stars'?' alt':''))}</div></div>`).join('')}</div>`}
function setFilter(f){filter=f;render()}function buyCar(id){let c=C[id];if(c.cls==='Stars')return notify('Скоро','Эксклюзивные машины появятся после подключения Telegram Stars.');if(p.owned.includes(id))return;if(p.coins<c.price)return notify('Не хватает монет','Нужно ещё '+fmt(c.price-p.coins)+' 🪙');p.coins-=c.price;p.owned.push(id);p.tune[id]=[0,0,0,0];p.plates[id]=randomPlate();p.active=id;log('Куплена '+c.name+' за '+c.price);render();notify('Новая тачка!','Поздравляем с покупкой '+escapeHtml(c.name))}function selectCar(id){if(!p.owned.includes(id))return;p.active=id;save();render()}function sellCar(id){if(!p.owned.includes(id)||p.owned.length===1)return notify('Нельзя продать','В гараже должна остаться хотя бы одна машина.');let amount=Math.floor((C[id].price+priceTune(id))*.5);showModal(`<h2>Продать ${escapeHtml(C[id].name)}?</h2><p>Получишь ${fmt(amount)} 🪙 (50% от машины и тюнинга).</p>${btn('Продать',`confirmSell(${id})`)} ${btn('Отмена','closeModal()','alt')}`)}function confirmSell(id){let amount=Math.floor((C[id].price+priceTune(id))*.5);p.coins+=amount;p.owned=p.owned.filter(x=>x!==id);delete p.tune[id];delete p.plates[id];log('Продана '+C[id].name+' за '+amount);closeModal();render()}
function tuningView(){let s=stats();return `<h2 class="title">Тюнинг · ${escapeHtml(car().nick)}</h2><div class="panel"><div class="row"><b>${fmt(s.hp)} л.с. · ${s.speed} км/ч</b><span class="pill">ДПС ${s.risk}%</span></div><div class="hero" style="height:125px"><div class="car-art" style="font-size:78px">🚗</div></div></div><div class="list">${SLOTS.map((slot,i)=>`<div class="panel"><b>${i+1}. ${slot.name}</b><div class="stack" style="margin-top:10px">${slot.opts.map((o,j)=>`<div class="row"><div><b>${escapeHtml(o[0])}</b><div class="sub">${o[2]?'+'+Math.round(o[2]*100)+'% л.с. · ':''}${o[3]?'+'+o[3]+' км/ч · ':''}${o[4]?'ДПС +'+o[4]+'%':''}</div></div>${btn(tun()[i]===j?'Установлено':(o[1]+' 🪙'),`install(${i},${j})`,(tun()[i]===j?'alt ':'')+'smallbtn')}</div>`).join('')}</div></div>`).join('')}</div><p class="notice">Замена детали оплачивается полностью; ранее установленная деталь остаётся в истории стоимости только до замены.</p>`}
function install(i,j){if(tun()[i]===j)return;let cost=SLOTS[i].opts[j][1];if(p.coins<cost)return notify('Не хватает монет','Нужно '+(cost-p.coins)+' 🪙');p.coins-=cost;let t=[...tun()];t[i]=j;p.tune[p.active]=t;log('Тюнинг '+car().name+': '+SLOTS[i].opts[j][0]+' за '+cost);render()}
function randomPlate(){let pick=()=>LETTERS[Math.floor(Math.random()*LETTERS.length)];return pick()+String(1+Math.floor(Math.random()*999)).padStart(3,'0')+pick()+pick()+REGIONS[Math.floor(Math.random()*REGIONS.length)]}
function platesView(){return `<h2 class="title">Номерные знаки</h2><div class="panel" style="text-align:center">${plate()}<p class="notice">Формат: А777АА77. Разрешённые буквы: ${LETTERS}. Реальные коды регионов.</p><label>Новый номер (100 🪙)</label><input id="plateInput" maxlength="9" placeholder="А777АА77"><label>Домашний регион (+5% к награде)</label><select id="regionInput">${REGIONS.map(r=>`<option ${p.homeRegion===r?'selected':''}>${r}</option>`).join('')}</select><div class="stack">${btn('Установить номер','setPlate()')}${btn('Случайный номер · 50 🪙','rollPlate()','alt')}${btn('Сохранить домашний регион','setHomeRegion()','alt')}</div></div><p class="notice">Специальные номера ADMIN, МЕНТ, ДПС, ФСБ и КОРТЕЖ относятся к игровым коллекционным номерам и не являются стандартными регистрационными знаками.</p>`}
function setPlate(){let v=$('plateInput').value.toUpperCase().replace(/[\s-]/g,'');if(!new RegExp('^['+LETTERS+']\\d{3}['+LETTERS+']{2}\\d{2,3}$').test(v)||!REGIONS.some(r=>v.endsWith(r)&&v.slice(0,-r.length).length===6)||v.slice(1,4)==='000')return notify('Неверный номер','Проверь буквы, цифры от 001 до 999 и существующий регион.');if(p.coins<100)return notify('Не хватает монет','Нужно 100 🪙');p.coins-=100;p.plates[p.active]=v;log('Куплен номер '+v);render()}function rollPlate(){if(p.coins<50)return notify('Не хватает монет','Нужно 50 🪙');p.coins-=50;p.plates[p.active]=randomPlate();log('Получен случайный номер');render()}function setHomeRegion(){p.homeRegion=$('regionInput').value;save();render();notify('Регион сохранён','Домашний регион: '+p.homeRegion)}
function raceView(){return `<h2 class="title">Гонка 1 на 1</h2><div class="panel"><div class="racer"><div><div class="sub">ТЫ</div><div style="font-size:55px">🚗</div><b>${escapeHtml(car().nick)}</b><div class="sub">${stats().hp} л.с.</div></div><div><div class="sub">СОПЕРНИК · ИИ</div><div style="font-size:55px">🚙</div><b id="botName">${race?escapeHtml(C[race.bot].nick):'Случайный'}</b><div class="sub">Бот</div></div></div><p class="notice">Тапай, когда белый маркер в зелёной зоне. Промах — мотор глохнет на секунду.</p><div class="meter"><div class="zone"></div><div class="needle" id="needle"></div></div><div class="row"><b>ТЫ</b><b id="mePercent">0%</b></div><div class="bar"><div id="meBar"></div></div><div class="row" style="margin-top:12px"><b>БОТ</b><b id="botPercent">0%</b></div><div class="bar"><div id="botBar" style="background:#e16d64"></div></div><p class="sub" id="raceMessage">Победа: +50 монет · Поражение: 0 монет</p><div class="stack">${race?btn('ТАП!','tap()','bigTap'):btn('🏁 Начать гонку','startRace()')}</div></div>`}
function drawRace(){if(!race)return;let n=$('needle');if(n)n.style.left=race.needle+'%';for(let [id,val] of [['meBar',race.me],['botBar',race.ai]]){let e=$(id);if(e)e.style.width=Math.min(100,val)+'%'}if($('mePercent'))$('mePercent').textContent=Math.floor(race.me)+'%';if($('botPercent'))$('botPercent').textContent=Math.floor(race.ai)+'%';if($('raceMessage'))$('raceMessage').textContent=Date.now()<race.stall?'Мотор заглох!':'Попади в зелёную зону!'}function startRace(){if(race)return;if(p.impoundUntil>Date.now())return notify('Штрафстоянка','Машина пока на штрафстоянке. Освободи её в разделе ДПС.');let choices=C.filter(c=>c.id<23&&c.price>=Math.max(100,car().price-400)&&c.price<=Math.max(450,car().price+500));race={bot:choices[Math.floor(Math.random()*choices.length)].id,me:0,ai:0,needle:0,dir:1,stall:0,last:performance.now(),started:performance.now()};render();raceTimer=setInterval(()=>{if(!race)return;let now=performance.now(),dt=Math.min(.08,(now-race.last)/1000);race.last=now;race.needle+=race.dir*dt*115;if(race.needle>99){race.needle=99;race.dir=-1}if(race.needle<0){race.needle=0;race.dir=1}race.ai+=dt*(9+Math.min(12,C[race.bot].hp/80));drawRace();if(race.ai>=100)finishRace(false)},30)}function tap(){if(!race)return;let now=Date.now();if(now<race.stall)return;vibrate();if(race.needle>=60&&race.needle<=85){race.me+=Math.min(27,12+stats().hp/120);try{tg?.HapticFeedback?.notificationOccurred('success')}catch(e){}}else{race.stall=now+1000;try{tg?.HapticFeedback?.notificationOccurred('error')}catch(e){}}drawRace();if(race.me>=100)finishRace(true)}function stopRace(){clearInterval(raceTimer);raceTimer=null;race=null}function finishRace(win){if(!race)return;stopRace();p.races++;if(win){p.wins++;let bonus=50+Math.round(50*(p.homeRegion===(p.plates[p.active]||'').match(/\d{2,3}$/)?.[0]?0.05:0));p.coins+=bonus;log('Победа над ИИ +'+bonus);p.clean++}else{p.losses++;log('Поражение в гонке')}p.level=1+Math.floor(p.wins/10);checkAchievements();render();if(win&&Math.random()*100<stats().risk){setTimeout(()=>dpsStop(),200)}else notify(win?'🏆 Победа!':'Соперник быстрее',win?'Награда за гонку начислена.':'Попробуй прокачать двигатель и попасть в зелёную зону.')}
function dpsView(){let remain=Math.max(0,Math.ceil((p.impoundUntil-Date.now())/60000));return `<h2 class="title">🚔 ДПС</h2><div class="panel"><h3>Риск остановки: ${stats().risk}%</h3><p class="notice">Штраф 100 монет. Взятка 80 монет, 40% риск провала. Побег — 10 секунд.</p><p>Штрафстоянка: <b>${remain?remain+' мин.':'машина свободна'}</b></p>${remain?`<div class="stack">${btn('Выкупить за 500 🪙','releaseCar()')}${btn('Достать ключи · мини-игра','keysGame()','alt')}</div>`:''}</div><div class="panel"><h3>Статистика</h3><p>Побеги: ${p.escapes} · Взятки: ${p.bribes} · Штрафстоянки: ${p.impounds}</p></div>`}
function dpsStop(){p.clean=0;save();showModal(`<h2 style="color:var(--red)">🚨 ДПС!</h2><p>«Слышь, водитель, притормози. Документы готовь.»</p><p class="notice">У тебя 5 секунд, чтобы спрятать запрещённые детали.</p>${btn('Спрятать запрещёнку','hidePartsGame()')}${btn('К инспектору','inspector()','alt')}`)}function hidePartsGame(){modalState={kind:'hide',left:5,until:Date.now()+5000};showModal(`<h2>Спрячь запрещёнку!</h2><p>Успей нажать 5 раз за 5 секунд</p><h1 id="hideCount">5</h1>${btn('📦 СПРЯТАТЬ','hidePartTap()')}`)}function hidePartTap(){if(modalState?.kind!=='hide')return;if(Date.now()>modalState.until){inspector();return}modalState.left--;if(modalState.left<=0){p.clean++;save();return notify('Пронесло!','Инспектор ничего не нашёл. Можешь ехать.')}if($('hideCount'))$('hideCount').textContent=modalState.left}function inspector(){modalState=null;showModal(`<h2>🚔 Разговор с инспектором</h2><p>«Ну что, водитель, решать будем?»</p><div class="stack">${btn('Штраф −100 🪙','fine()')}${btn('Взятка −80 🪙 (риск 40%)','bribe()','alt')}${btn('Попытаться уехать','escapeGame()','red')}</div>`)}function fine(){p.coins=Math.max(0,p.coins-100);log('Штраф ДПС −100');closeModal();render()}function bribe(){p.bribes++;if(Math.random()<.4){p.coins=Math.max(0,p.coins-500);let t=[...tun()],installed=t.map((x,i)=>x>0?i:-1).filter(x=>x>=0);if(installed.length)t[installed[Math.floor(Math.random()*installed.length)]]=0;p.tune[p.active]=t;log('Провал взятки −500 и конфискация детали');closeModal();render();notify('Не договорились','−500 монет. Одну установленную деталь могли конфисковать.')}else{p.coins=Math.max(0,p.coins-80);log('Договорился с ДПС −80');closeModal();render();notify('Отпустили','Инспектор пожелал счастливого пути.')}checkAchievements()}function escapeGame(){modalState={kind:'escape',t:Date.now()+10000,me:0,ai:0};showModal(`<h2>🏁 Побег от ДПС</h2><p>10 секунд. Жми как можно быстрее!</p><p id="escapeClock">10 сек.</p><div class="bar"><div id="escapeMe"></div></div><div class="bar" style="margin-top:9px"><div id="escapeAi" style="background:var(--red)"></div></div><div style="margin-top:14px">${btn('ГАЗ!','escapeTap()','bigTap')}</div>`);let token=modalState;let iv=setInterval(()=>{if(modalState!==token){clearInterval(iv);return}let left=Math.max(0,(token.t-Date.now())/1000);token.ai=Math.min(100,(10-left)*8);if($('escapeClock'))$('escapeClock').textContent=left.toFixed(1)+' сек.';if($('escapeAi'))$('escapeAi').style.width=token.ai+'%';if(left<=0){clearInterval(iv);let win=token.me>token.ai&&Math.random()<.5;modalState=null;if(win){p.escapes++;log('Успешный побег от ДПС');checkAchievements();notify('Ушёл от погони!','На этот раз повезло.')}else{p.impoundUntil=Date.now()+3600000;p.impounds++;log('Машина на штрафстоянке на 1 час');checkAchievements();notify('Штрафстоянка','Машину увезли на 1 час. Освободить её можно в разделе ДПС.')}render()}},100)}function escapeTap(){if(modalState?.kind!=='escape')return;modalState.me=Math.min(100,modalState.me+3);if($('escapeMe'))$('escapeMe').style.width=modalState.me+'%';vibrate()}function releaseCar(){if(p.coins<500)return notify('Не хватает монет','Нужно 500 🪙');p.coins-=500;p.impoundUntil=0;log('Освобождение машины −500');render()}function keysGame(){modalState={kind:'keys',until:Date.now()+30000,taps:0};showModal(`<h2>🔑 Достать ключи</h2><p>Нажми 40 раз за 30 секунд</p><h2 id="keyCounter">0 / 40</h2>${btn('🔑 ТАП','keyTap()','bigTap')}`)}function keyTap(){if(modalState?.kind!=='keys')return;if(Date.now()>modalState.until){closeModal();return notify('Не вышло','Время закончилось.')}modalState.taps++;if($('keyCounter'))$('keyCounter').textContent=modalState.taps+' / 40';if(modalState.taps>=40){p.impoundUntil=0;log('Машина освобождена мини-игрой');closeModal();render();notify('Ключи добыты!','Машина снова в гараже.')}}
const ACH=[['Чистый лист','50 гонок без остановки ДПС',p=>p.clean>=50],['Друг майора','100 взяток',p=>p.bribes>=100],['Шумахер','20 побегов от ДПС',p=>p.escapes>=20],['На штрафстоянке','10 посещений штрафстоянки',p=>p.impounds>=10],['Первый финиш','Первая победа',p=>p.wins>=1],['Гараж мечты','5 автомобилей',p=>p.owned.length>=5]];function checkAchievements(){ACH.forEach(a=>{if(a[2](p)&&!p.achievements.includes(a[0])){p.achievements.push(a[0]);log('Достижение: '+a[0])}});save()}function achView(){return `<h2 class="title">Достижения</h2><div class="list">${ACH.map(a=>`<div class="item"><b>${p.achievements.includes(a[0])?'🏆':'🔒'} ${a[0]}</b><div class="sub">${a[1]}</div></div>`).join('')}</div>`}
function profileView(){let u=tg?.initDataUnsafe?.user;return `<h2 class="title">Профиль гонщика</h2><div class="panel"><div class="row"><div><b>${escapeHtml(u?.first_name||'Уличный гонщик')} ${escapeHtml(u?.last_name||'')}</b><div class="sub">${u?.username?'@'+escapeHtml(u.username):'Локальный профиль'} · Ур. ${p.level}</div></div><span class="pill">🏆 ${p.wins} побед</span></div><div class="divider"></div><div class="statgrid"><div class="stat">Монеты<b>${fmt(p.coins)}</b></div><div class="stat">Машины<b>${p.owned.length}</b></div><div class="stat">Гонки<b>${p.races}</b></div><div class="stat">Поражения<b>${p.losses}</b></div></div></div><div class="panel"><h3>${escapeHtml(car().name)}</h3><div style="text-align:center">${plate()}</div><p>${stats().hp} л.с. · ${stats().speed} км/ч · стоимость ${fmt(stats().value)} 🪙</p><p class="sub">Тюнинг: ${tun().map((v,i)=>SLOTS[i].opts[v][0]).join(' / ')}</p></div><div class="stack">${btn('🏆 Достижения','go(\'achievements\')','alt')}${btn('📜 История покупок','go(\'history\')','alt')}${btn('🚔 ДПС','go(\'dps\')','alt')}${btn('🛠 Локальная панель разработчика','go(\'admin\')','alt')}</div><p class="notice">Данные сохраняются в браузере этого устройства. Для переноса прогресса между устройствами позже подключим сервер.</p>`}
function historyView(){return `<h2 class="title">История</h2><div class="list">${p.history.length?p.history.map(x=>`<div class="item"><b>${escapeHtml(x.text)}</b><div class="sub">${escapeHtml(x.date)}</div></div>`).join(''):'<p class="notice">История пока пуста.</p>'}</div>`}
function adminView(){return `<h2 class="title">Локальная панель разработчика</h2><div class="panel"><p class="notice">Только для тестирования на своём устройстве. Это НЕ защищённая серверная админка, и её нельзя использовать для выдачи призов другим игрокам.</p><input id="cmd" placeholder="dreamteam или dreamteam(Bugatti Veyron)">${btn('Применить команду','adminCmd()')}<p class="sub">Поддерживаются dreamteam, dreamteam(машина), dreamteam(А777АА777). Эксклюзивы Stars заблокированы.</p></div>`}
function adminCmd(){let cmd=$('cmd').value.trim(),arg=cmd.match(/^dreamteam\((.+)\)$/i);if(cmd==='dreamteam'){p.coins+=1000;log('Тестовая команда: +1000');render();return notify('Готово','+1000 монет')}if(!arg)return notify('Неизвестная команда','Проверь синтаксис.');let v=arg[1].trim(),c=C.find(c=>c.name.toLowerCase()===v.toLowerCase());if(c){if(c.cls==='Stars')return notify('Недоступно','Эксклюзивы нельзя выдавать через локальную панель.');if(!p.owned.includes(c.id)){p.owned.push(c.id);p.tune[c.id]=[0,0,0,0];p.plates[c.id]=randomPlate()}p.active=c.id;log('Тестовая выдача '+c.name);render();return notify('Выдан автомобиль',escapeHtml(c.name))}let num=v.toUpperCase().replace(/[\s-]/g,'');if(/^[АВЕКМНОРСТУХ]\d{3}[АВЕКМНОРСТУХ]{2}\d{2,3}$/.test(num)&&REGIONS.some(r=>num.endsWith(r)&&num.length-r.length===6)){p.plates[p.active]=num;log('Тестовая выдача номера '+num);render();return notify('Выдан номер',escapeHtml(num))}notify('Не найдено','Для выдачи укажи точное название машины или стандартный номер.')}
window.addEventListener('beforeunload',save);render();daily();
</script></body></html>
