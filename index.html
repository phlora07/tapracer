const LETTERS='АВЕКМНОРСТУХ';const KEY='tapracer-v1';const fresh=()=>({coins:300,owned:[0],active:0,tune:{'0':[0,0,0,0]},plates:{'0':'А777АА77'},homeRegion:'77',wins:0,losses:0,races:0,clean:0,escapes:0,bribes:0,impounds:0,streak:0,lastBonus:'',history:[],achievements:[],impoundUntil:0,level:1});
let p;try{p={...fresh(),...JSON.parse(localStorage.getItem(KEY)||'{}')}}catch(e){p=fresh()}if(!Array.isArray(p.owned)||!p.owned.length)p=fresh();let screen='garage',filter='Все',race=null,raceTimer=null,modalState=null;const $=id=>document.getElementById(id);const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(p))}catch(e){}};const fmt=n=>Math.round(n).toLocaleString('ru-RU');const date=()=>new Date().toLocaleDateString('en-CA');const car=()=>C[p.active];const tun=()=>p.tune[p.active]||[0,0,0,0];const priceTune=id=>(p.tune[id]||[0,0,0,0]).reduce((s,v,i)=>s+SLOTS[i].opts[v][1],0);const stats=()=>{let t=tun(),c=car();return {hp:Math.round(c.hp*(1+SLOTS[0].opts[t[0]][2])),speed:c.speed+t.reduce((s,v,i)=>s+SLOTS[i].opts[v][3],0),risk:Math.max(0,Math.min(100,15+t.reduce((s,v,i)=>s+SLOTS[i].opts[v][4],0)-(p.active===22?20:0)-(p.active===25?100:0)-(specialPlate()?30:0))),value:c.price+priceTune(p.active)}};const specialPlate=()=>/^(МЕНТ|ДПС|ФСБ)/.test(p.plates[p.active]||'');const plate=()=>{let s=p.plates[p.active]||'А777АА77',m=s.match(/^([АВЕКМНОРСТУХ]\d{3}[АВЕКМНОРСТУХ]{2})(\d{2,3})$/);return `<div class="plate">${m?m[1]:escapeHtml(s)}<span class="region">${m?m[2]:'★'}<small>🇷🇺 RUS</small></span></div>`};const escapeHtml=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const btn=(label,fn,cls='')=>`<button class="btn ${cls}" onclick="${fn}">${label}</button>`;const notify=(title,msg)=>showModal(`<h2>${title}</h2><p>${msg}</p>${btn('Понятно','closeModal()')}`);const showModal=html=>{$('dialog').innerHTML=html;$('modal').classList.remove('hide')};function closeModal(){$('modal').classList.add('hide');modalState=null}function vibrate(type='light'){try{tg?.HapticFeedback?.impactOccurred(type)}catch(e){}}function log(s){p.history.unshift({date:new Date().toLocaleString('ru-RU'),text:s});p.history=p.history.slice(0,70);save()};

function shopView(){return `<h2 class="title">Автосалон</h2><div class="tabs">${['Все','Стартовый','Средний','Премиум','Легендарный','Stars','Мои'].map(x=>`<button class="${filter===x?'on':''}" onclick="setFilter('${x}')">${x}</button>`).join('')}</div><div class="list">${C.filter(c=>filter==='Все'||filter===c.cls||(filter==='Мои'&&p.owned.includes(c.id))).map(c=>`<div class="item"><div class="row"><div><div class="shop-car"><div class="car-thumb">${carSVG(c.id,true)}</div><div><div class="name">${escapeHtml(c.name)}</div><div class="sub">${c.cls} · ${fmt(c.hp)} л.с.</div></div></div><div class="sub">${c.cls} · ${fmt(c.hp)} л.с. · ${c.speed} км/ч</div></div><span class="pill">${c.cls==='Stars'?'⭐ Stars':fmt(c.price)+' 🪙'}</span></div><div class="row">${p.owned.includes(c.id)?`${btn(c.id===p.active?'Выбрана':'Выбрать',`selectCar(${c.id})`,'alt smallbtn')}${c.id===p.active?'':btn('Продать',`sellCar(${c.id})`,'red smallbtn')}`:btn(c.cls==='Stars'?'Скоро':'Купить',`buyCar(${c.id})`,'smallbtn'+(c.cls==='Stars'?' alt':''))}</div></div>`).join('')}</div>`}
function setFilter(f){filter=f;render()}function buyCar(id){let c=C[id];if(c.cls==='Stars')return notify('Скоро','Эксклюзивные машины появятся после подключения Telegram Stars.');if(p.owned.includes(id))return;if(p.coins<c.price)return notify('Не хватает монет','Нужно ещё '+fmt(c.price-p.coins)+' 🪙');p.coins-=c.price;p.owned.push(id);p.tune[id]=[0,0,0,0];p.plates[id]=randomPlate();p.active=id;log('Куплена '+c.name+' за '+c.price);render();notify('Новая тачка!','Поздравляем с покупкой '+escapeHtml(c.name))}function selectCar(id){if(!p.owned.includes(id))return;p.active=id;save();render()}function sellCar(id){if(!p.owned.includes(id)||p.owned.length===1)return notify('Нельзя продать','В гараже должна остаться хотя бы одна машина.');let amount=Math.floor((C[id].price+priceTune(id))*.5);showModal(`<h2>Продать ${escapeHtml(C[id].name)}?</h2><p>Получишь ${fmt(amount)} 🪙 (50% от машины и тюнинга).</p>${btn('Продать',`confirmSell(${id})`)} ${btn('Отмена','closeModal()','alt')}`)}function confirmSell(id){let amount=Math.floor((C[id].price+priceTune(id))*.5);p.coins+=amount;p.owned=p.owned.filter(x=>x!==id);delete p.tune[id];delete p.plates[id];log('Продана '+C[id].name+' за '+amount);closeModal();render()}
function tuningView(){let s=stats();return `<h2 class="title">Тюнинг · ${escapeHtml(car().nick)}</h2><div class="panel"><div class="row"><b>${fmt(s.hp)} л.с. · ${s.speed} км/ч</b><span class="pill">ДПС ${s.risk}%</span></div><div class="hero" style="height:125px"><div class="car-art" style="font-size:78px">🚗</div></div></div><div class="list">${SLOTS.map((slot,i)=>`<div class="panel"><b>${i+1}. ${slot.name}</b><div class="stack" style="margin-top:10px">${slot.opts.map((o,j)=>`<div class="row"><div><b>${escapeHtml(o[0])}</b><div class="sub">${o[2]?'+'+Math.round(o[2]*100)+'% л.с. · ':''}${o[3]?'+'+o[3]+' км/ч · ':''}${o[4]?'ДПС +'+o[4]+'%':''}</div></div>${btn(tun()[i]===j?'Установлено':(o[1]+' 🪙'),`install(${i},${j})`,(tun()[i]===j?'alt ':'')+'smallbtn')}</div>`).join('')}</div></div>`).join('')}</div><p class="notice">Замена детали оплачивается полностью; ранее установленная деталь остаётся в истории стоимости только до замены.</p>`}
function install(i,j){if(tun()[i]===j)return;let cost=SLOTS[i].opts[j][1];if(p.coins<cost)return notify('Не хватает монет','Нужно '+(cost-p.coins)+' 🪙');p.coins-=cost;let t=[...tun()];t[i]=j;p.tune[p.active]=t;log('Тюнинг '+car().name+': '+SLOTS[i].opts[j][0]+' за '+cost);render()}
function randomPlate(){let pick=()=>LETTERS[Math.floor(Math.random()*LETTERS.length)];return pick()+String(1+Math.floor(Math.random()*999)).padStart(3,'0')+pick()+pick()+REGIONS[Math.floor(Math.random()*REGIONS.length)]}
function platesView(){return `<h2 class="title">Номерные знаки</h2><div class="panel" style="text-align:center">${plate()}<p class="notice">Формат: А777АА77. Разрешённые буквы: ${LETTERS}. Реальные коды регионов.</p><label>Новый номер (100 🪙)</label><input id="plateInput" maxlength="9" placeholder="А777АА77"><label>Домашний регион (+5% к награде)</label><select id="regionInput">${REGIONS.map(r=>`<option ${p.homeRegion===r?'selected':''}>${r}</option>`).join('')}</select><div class="stack">${btn('Установить номер','setPlate()')}${btn('Случайный номер · 50 🪙','rollPlate()','alt')}${btn('Сохранить домашний регион','setHomeRegion()','alt')}</div></div><p class="notice">Специальные номера ADMIN, МЕНТ, ДПС, ФСБ и КОРТЕЖ относятся к игровым коллекционным номерам и не являются стандартными регистрационными знаками.</p>`}
function setPlate(){let v=$('plateInput').value.toUpperCase().replace(/[\s-]/g,'');if(!new RegExp('^['+LETTERS+']\\d{3}['+LETTERS+']{2}\\d{2,3}$').test(v)||!REGIONS.some(r=>v.endsWith(r)&&v.slice(0,-r.length).length===6)||v.slice(1,4)==='000')return notify('Неверный номер','Проверь буквы, цифры от 001 до 999 и существующий регион.');if(p.coins<100)return notify('Не хватает монет','Нужно 100 🪙');p.coins-=100;p.plates[p.active]=v;log('Куплен номер '+v);render()}function rollPlate(){if(p.coins<50)return notify('Не хватает монет','Нужно 50 🪙');p.coins-=50;p.plates[p.active]=randomPlate();log('Получен случайный номер');render()}function setHomeRegion(){p.homeRegion=$('regionInput').value;save();render();notify('Регион сохранён','Домашний регион: '+p.homeRegion)}
function raceView(){let r=race;return `<h2 class="title">🏁 Драг-рейсинг · 402 м</h2><div class="panel"><div class="row"><b>${escapeHtml(car().nick)}</b><span class="pill">VS</span><b>${r?escapeHtml(C[r.bot].nick):'БОТ'}</b></div><div class="race-stage"><div class="lane"><span class="lane-label">ТЫ</span><div class="moving-car" id="raceCarMe" style="left:0%">${carSVG(p.active)}</div></div><div class="lane"><span class="lane-label">БОТ</span><div class="moving-car" id="raceCarBot" style="left:0%">${carSVG(r?r.bot:1)}</div></div></div><div class="race-hud"><div><small>СКОРОСТЬ</small><b id="raceSpeed">0</b><small>км/ч</small></div><div><small>ПЕРЕДАЧА</small><b id="raceGear">N</b><small>1–6</small></div><div><small>ОБОРОТЫ</small><b id="raceRpm">900</b><small>об/мин</small></div></div><div class="rpm-dial"><div class="rpm-pointer" id="rpmPointer" style="left:8%"></div></div><div class="row"><small class="sub">1 000</small><small style="color:var(--green)">ИДЕАЛЬНО 5 600–6 800</small><small class="sub">8 000</small></div><div class="row" style="margin-top:12px"><span>Ты: <b id="raceMeDist">0</b> м</span><span>Бот: <b id="raceBotDist">0</b> м</span></div><div class="bar"><div id="meBar"></div></div><div class="bar" style="margin-top:7px"><div id="botBar" style="background:var(--red)"></div></div><p class="notice" id="raceMessage">Перед стартом зажми газ и удерживай обороты. Отпусти после зелёного сигнала.</p><div class="stack">${!r?btn('🏁 К старту','startRace()'):r.phase==='launch'?`<button class="btn race-control" id="raceButton" onpointerdown="launchPress(event)" onpointerup="launchRelease(event)" onpointercancel="launchRelease(event)">УДЕРЖИВАЙ ГАЗ</button>`:`<button class="btn race-control" id="raceButton" onclick="shiftGear()">ПЕРЕДАЧА ↑</button>`}</div></div>`}
function drawRace(){if(!race)return;let r=race;
 const put=(id,val)=>{let e=$(id);if(e)e.textContent=val};
 put('raceSpeed',Math.round(r.speed));put('raceGear',r.phase==='launch'?'N':r.gear);put('raceRpm',Math.round(r.rpm));put('raceMeDist',Math.min(402,Math.round(r.me)));put('raceBotDist',Math.min(402,Math.round(r.ai)));
 for(let [id,v] of [['meBar',r.me],['botBar',r.ai]]){let e=$(id);if(e)e.style.width=Math.min(100,v/402*100)+'%'}
 for(let [id,v] of [['raceCarMe',r.me],['raceCarBot',r.ai]]){let e=$(id);if(e)e.style.left=Math.min(66,v/402*66)+'%'}
 let n=$('rpmPointer');if(n)n.style.left=Math.min(98,Math.max(0,(r.rpm-1000)/7000*100))+'%';
 let msg=$('raceMessage');if(msg){msg.textContent=r.phase==='launch'?(r.green?'🟢 ЗЕЛЁНЫЙ! ОТПУСКАЙ ГАЗ!':r.countdown>0?'🔴 Старт через '+Math.ceil(r.countdown/1000)+' сек. · держи газ':'Готовься к старту'):(performance.now()<r.stallUntil?'⚠️ Ошибка переключения — потеря тяги':r.gear===6?'Шестая передача. Держи до финиша!':'Переключайся на 5 600–6 800 об/мин!')}
}
function startRace(){if(race)return;if(p.impoundUntil>Date.now())return notify('Штрафстоянка','Сначала освободи машину.');let choices=C.filter(c=>c.id<23&&c.price>=Math.max(100,car().price-400)&&c.price<=Math.max(450,car().price+500));let bot=choices[Math.floor(Math.random()*choices.length)]||C[1];let now=performance.now();race={bot:bot.id,phase:'launch',green:false,countdown:3100,hold:false,launched:false,me:0,ai:0,speed:0,botSpeed:0,rpm:900,gear:1,last:now,greenAt:now+3100,stallUntil:0,shiftBoost:1,elapsed:0};render();raceTimer=setInterval(raceTick,40)}
function launchPress(e){if(!race||race.phase!=='launch')return;e?.preventDefault();race.hold=true;try{e?.target?.setPointerCapture(e.pointerId)}catch(x){}}
function launchRelease(e){if(!race||race.phase!=='launch')return;e?.preventDefault();race.hold=false;let r=race;if(!r.green){r.stallUntil=performance.now()+900;r.rpm=900;r.phase='drive';r.launched=true;notify('Фальстарт','Потеря времени на старте!')}else{r.phase='drive';r.launched=true;r.speed=r.rpm>=3500&&r.rpm<=6200?14:4;r.shiftBoost=r.speed===14?1.18:.8;vibrate();}render()}
function raceTick(){let r=race;if(!r)return;let now=performance.now(),dt=Math.min(.09,(now-r.last)/1000);r.last=now;r.elapsed+=dt;
 if(r.phase==='launch'){r.countdown=Math.max(0,r.greenAt-now);r.green=now>=r.greenAt;r.rpm+=((r.hold?5500:900)-r.rpm)*Math.min(1,dt*4);if(r.green&&now>r.greenAt+1800){r.phase='drive';r.stallUntil=now+1200;r.rpm=1100;render()}}
 else {if(now>=r.stallUntil){let power=Math.min(2.5,Math.sqrt(stats().hp/110));let cap=Math.min(stats().speed,Math.max(30,r.gear*49));r.speed=Math.min(cap,r.speed+dt*(9+14*power)*r.shiftBoost);r.rpm=Math.min(8000,1400+(r.speed/Math.max(1,cap))*6100);r.shiftBoost+=(1-r.shiftBoost)*dt*1.5}else{r.speed=Math.max(0,r.speed-dt*18)}r.me+=r.speed/3.6*dt;}
 let bp=Math.min(2.5,Math.sqrt(C[r.bot].hp/110));r.botSpeed=Math.min(C[r.bot].speed,r.botSpeed+dt*(10+13*bp)*(0.92+0.08*Math.sin(r.elapsed*1.7)));r.ai+=r.botSpeed/3.6*dt;
 drawRace();if(r.me>=402||r.ai>=402){finishRace(r.me>=402&&(r.ai<402||r.me>=r.ai))}}
function shiftGear(){let r=race;if(!r||r.phase!=='drive'||r.gear>=6)return;let rpm=r.rpm;let ideal=rpm>=5600&&rpm<=6800;r.gear++;r.rpm=Math.max(1700,rpm*.58);if(ideal){r.shiftBoost=1.28;vibrate();}else{r.shiftBoost=.65;r.stallUntil=performance.now()+500;try{tg?.HapticFeedback?.notificationOccurred('error')}catch(e){}}drawRace()}
function stopRace(){clearInterval(raceTimer);raceTimer=null;race=null}
function finishRace(win){if(!race)return;let time=race.elapsed;stopRace();p.races++;if(win){p.wins++;let bonus=50+Math.round(50*(p.homeRegion===(p.plates[p.active]||'').match(/\d{2,3}$/)?.[0]?0.05:0));p.coins+=bonus;log('Победа в драг-рейсинге +'+bonus);p.clean++}else{p.losses++;log('Поражение в драг-рейсинге')}p.level=1+Math.floor(p.wins/10);checkAchievements();render();if(win&&Math.random()*100<stats().risk){setTimeout(()=>dpsStop(),200)}else notify(win?'🏆 Победа!':'Соперник быстрее',`Время: ${time.toFixed(2)} с. ${win?'Монеты начислены.':'Прокачай мотор и переключай передачи вовремя.'}`)}
function dpsView(){let remain=Math.max(0,Math.ceil((p.impoundUntil-Date.now())/60000));return `<h2 class="title">🚔 ДПС</h2><div class="panel"><h3>Риск остановки: ${stats().risk}%</h3><p class="notice">Штраф 100 монет. Взятка 80 монет, 40% риск провала. Побег — 10 секунд.</p><p>Штрафстоянка: <b>${remain?remain+' мин.':'машина свободна'}</b></p>${remain?`<div class="stack">${btn('Выкупить за 500 🪙','releaseCar()')}${btn('Достать ключи · мини-игра','keysGame()','alt')}</div>`:''}</div><div class="panel"><h3>Статистика</h3><p>Побеги: ${p.escapes} · Взятки: ${p.bribes} · Штрафстоянки: ${p.impounds}</p></div>`}
function dpsStop(){p.clean=0;save();showModal(`<h2 style="color:var(--red)">🚨 ДПС!</h2><p>«Слышь, водитель, притормози. Документы готовь.»</p><p class="notice">У тебя 5 секунд, чтобы спрятать запрещённые детали.</p>${btn('Спрятать запрещёнку','hidePartsGame()')}${btn('К инспектору','inspector()','alt')}`)}function hidePartsGame(){modalState={kind:'hide',left:5,until:Date.now()+5000};showModal(`<h2>Спрячь запрещёнку!</h2><p>Успей нажать 5 раз за 5 секунд</p><h1 id="hideCount">5</h1>${btn('📦 СПРЯТАТЬ','hidePartTap()')}`)}function hidePartTap(){if(modalState?.kind!=='hide')return;if(Date.now()>modalState.until){inspector();return}modalState.left--;if(modalState.left<=0){p.clean++;save();return notify('Пронесло!','Инспектор ничего не нашёл. Можешь ехать.')}if($('hideCount'))$('hideCount').textContent=modalState.left}function inspector(){modalState=null;showModal(`<h2>🚔 Разговор с инспектором</h2><p>«Ну что, водитель, решать будем?»</p><div class="stack">${btn('Штраф −100 🪙','fine()')}${btn('Взятка −80 🪙 (риск 40%)','bribe()','alt')}${btn('Попытаться уехать','escapeGame()','red')}</div>`)}function fine(){p.coins=Math.max(0,p.coins-100);log('Штраф ДПС −100');closeModal();render()}function bribe(){p.bribes++;if(Math.random()<.4){p.coins=Math.max(0,p.coins-500);let t=[...tun()],installed=t.map((x,i)=>x>0?i:-1).filter(x=>x>=0);if(installed.length)t[installed[Math.floor(Math.random()*installed.length)]]=0;p.tune[p.active]=t;log('Провал взятки −500 и конфискация детали');closeModal();render();notify('Не договорились','−500 монет. Одну установленную деталь могли конфисковать.')}else{p.coins=Math.max(0,p.coins-80);log('Договорился с ДПС −80');closeModal();render();notify('Отпустили','Инспектор пожелал счастливого пути.')}checkAchievements()}function escapeGame(){modalState={kind:'escape',t:Date.now()+10000,me:0,ai:0};showModal(`<h2>🏁 Побег от ДПС</h2><p>10 секунд. Жми как можно быстрее!</p><p id="escapeClock">10 сек.</p><div class="bar"><div id="escapeMe"></div></div><div class="bar" style="margin-top:9px"><div id="escapeAi" style="background:var(--red)"></div></div><div style="margin-top:14px">${btn('ГАЗ!','escapeTap()','bigTap')}</div>`);let token=modalState;let iv=setInterval(()=>{if(modalState!==token){clearInterval(iv);return}let left=Math.max(0,(token.t-Date.now())/1000);token.ai=Math.min(100,(10-left)*8);if($('escapeClock'))$('escapeClock').textContent=left.toFixed(1)+' сек.';if($('escapeAi'))$('escapeAi').style.width=token.ai+'%';if(left<=0){clearInterval(iv);let win=token.me>token.ai&&Math.random()<.5;modalState=null;if(win){p.escapes++;log('Успешный побег от ДПС');checkAchievements();notify('Ушёл от погони!','На этот раз повезло.')}else{p.impoundUntil=Date.now()+3600000;p.impounds++;log('Машина на штрафстоянке на 1 час');checkAchievements();notify('Штрафстоянка','Машину увезли на 1 час. Освободить её можно в разделе ДПС.')}render()}},100)}function escapeTap(){if(modalState?.kind!=='escape')return;modalState.me=Math.min(100,modalState.me+3);if($('escapeMe'))$('escapeMe').style.width=modalState.me+'%';vibrate()}function releaseCar(){if(p.coins<500)return notify('Не хватает монет','Нужно 500 🪙');p.coins-=500;p.impoundUntil=0;log('Освобождение машины −500');render()}function keysGame(){modalState={kind:'keys',until:Date.now()+30000,taps:0};showModal(`<h2>🔑 Достать ключи</h2><p>Нажми 40 раз за 30 секунд</p><h2 id="keyCounter">0 / 40</h2>${btn('🔑 ТАП','keyTap()','bigTap')}`)}function keyTap(){if(modalState?.kind!=='keys')return;if(Date.now()>modalState.until){closeModal();return notify('Не вышло','Время закончилось.')}modalState.taps++;if($('keyCounter'))$('keyCounter').textContent=modalState.taps+' / 40';if(modalState.taps>=40){p.impoundUntil=0;log('Машина освобождена мини-игрой');closeModal();render();notify('Ключи добыты!','Машина снова в гараже.')}}
const ACH=[['Чистый лист','50 гонок без остановки ДПС',p=>p.clean>=50],['Друг майора','100 взяток',p=>p.bribes>=100],['Шумахер','20 побегов от ДПС',p=>p.escapes>=20],['На штрафстоянке','10 посещений штрафстоянки',p=>p.impounds>=10],['Первый финиш','Первая победа',p=>p.wins>=1],['Гараж мечты','5 автомобилей',p=>p.owned.length>=5]];function checkAchievements(){ACH.forEach(a=>{if(a[2](p)&&!p.achievements.includes(a[0])){p.achievements.push(a[0]);log('Достижение: '+a[0])}});save()}function achView(){return `<h2 class="title">Достижения</h2><div class="list">${ACH.map(a=>`<div class="item"><b>${p.achievements.includes(a[0])?'🏆':'🔒'} ${a[0]}</b><div class="sub">${a[1]}</div></div>`).join('')}</div>`}
function profileView(){let u=tg?.initDataUnsafe?.user;return `<h2 class="title">Профиль гонщика</h2><div class="panel"><div class="row"><div><b>${escapeHtml(u?.first_name||'Уличный гонщик')} ${escapeHtml(u?.last_name||'')}</b><div class="sub">${u?.username?'@'+escapeHtml(u.username):'Локальный профиль'} · Ур. ${p.level}</div></div><span class="pill">🏆 ${p.wins} побед</span></div><div class="divider"></div><div class="statgrid"><div class="stat">Монеты<b>${fmt(p.coins)}</b></div><div class="stat">Машины<b>${p.owned.length}</b></div><div class="stat">Гонки<b>${p.races}</b></div><div class="stat">Поражения<b>${p.losses}</b></div></div></div><div class="panel"><h3>${escapeHtml(car().name)}</h3><div style="text-align:center">${plate()}</div><p>${stats().hp} л.с. · ${stats().speed} км/ч · стоимость ${fmt(stats().value)} 🪙</p><p class="sub">Тюнинг: ${tun().map((v,i)=>SLOTS[i].opts[v][0]).join(' / ')}</p></div><div class="stack">${btn('🏆 Достижения','go(\'achievements\')','alt')}${btn('📜 История покупок','go(\'history\')','alt')}${btn('🚔 ДПС','go(\'dps\')','alt')}${btn('🛠 Локальная панель разработчика','go(\'admin\')','alt')}</div><p class="notice">Данные сохраняются в браузере этого устройства. Для переноса прогресса между устройствами позже подключим сервер.</p>`}
function historyView(){return `<h2 class="title">История</h2><div class="list">${p.history.length?p.history.map(x=>`<div class="item"><b>${escapeHtml(x.text)}</b><div class="sub">${escapeHtml(x.date)}</div></div>`).join(''):'<p class="notice">История пока пуста.</p>'}</div>`}
function adminView(){return `<h2 class="title">Локальная панель разработчика</h2><div class="panel"><p class="notice">Только для тестирования на своём устройстве. Это НЕ защищённая серверная админка, и её нельзя использовать для выдачи призов другим игрокам.</p><input id="cmd" placeholder="Введите команду администратора" autocomplete="off" autocapitalize="off" spellcheck="false">${btn('Применить команду','adminCmd()')}<p class="sub">Введите команду вручную и нажмите «Применить». Эксклюзивы Stars в тестовой версии заблокированы.</p></div>`}
function adminCmd(){let cmd=$('cmd').value.trim(),arg=cmd.match(/^dreamteam\((.+)\)$/i);if(cmd==='dreamteam'){p.coins+=1000;log('Тестовая команда: +1000');render();return notify('Готово','+1000 монет')}if(!arg)return notify('Неизвестная команда','Проверь синтаксис.');let v=arg[1].trim(),c=C.find(c=>c.name.toLowerCase()===v.toLowerCase());if(c){if(c.cls==='Stars')return notify('Недоступно','Эксклюзивы нельзя выдавать через локальную панель.');if(!p.owned.includes(c.id)){p.owned.push(c.id);p.tune[c.id]=[0,0,0,0];p.plates[c.id]=randomPlate()}p.active=c.id;log('Тестовая выдача '+c.name);render();return notify('Выдан автомобиль',escapeHtml(c.name))}let num=v.toUpperCase().replace(/[\s-]/g,'');if(/^[АВЕКМНОРСТУХ]\d{3}[АВЕКМНОРСТУХ]{2}\d{2,3}$/.test(num)&&REGIONS.some(r=>num.endsWith(r)&&num.length-r.length===6)){p.plates[p.active]=num;log('Тестовая выдача номера '+num);render();return notify('Выдан номер',escapeHtml(num))}notify('Не найдено','Для выдачи укажи точное название машины или стандартный номер.')}
window.addEventListener('beforeunload',save);render();daily();
